<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
</head>
<body>

<h1>Student Details</h1>

<table border="1">
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Course</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.roll }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.course }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
